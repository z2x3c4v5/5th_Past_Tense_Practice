name: Build Test A-B Word file
on:
  push:
    branches: [main]
    paths: [tools/build-test-docx.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx Pillow
      - run: python tools/build-test-docx.py
      - name: Commit generated Word test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets/past_tense_test_A_B.docx
          if ! git diff --cached --quiet; then
            git commit -m 'Add downloadable Test A-B Word worksheet'
            git push
          fi
