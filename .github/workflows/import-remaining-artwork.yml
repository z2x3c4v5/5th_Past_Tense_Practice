name: Import final 13 artwork scenes
on:
  push:
    branches: [artwork/finish-remaining-13]
    paths: [tools/remaining-artwork-manifest.json]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --quiet Pillow
      - name: Import 13 images and verify all 38 existing images and all teaching data
        run: python tools/import-remaining-artwork.py
      - name: Commit new images and image links only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/supplementary/ worksheet.js index.html .github/workflows/verify-production-artwork.yml tools/remaining-artwork-report.json
          git diff --cached --stat
          git diff --cached --exit-code -- app.js style.css illustrations.js worksheets/ 'img/*.png'
          if ! git diff --cached --quiet; then
            git commit -m 'Complete all 51 local lesson images; preserve original 21 and previous 17'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-artwork-review
          path: |
            remaining-artwork-contact.jpg
            tools/remaining-artwork-report.json
            img/supplementary/*.webp
