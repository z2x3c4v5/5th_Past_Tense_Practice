name: Import supplementary artwork
on:
  push:
    branches: [artwork/complete-missing-scenes]
    paths: [tools/supplementary-artwork-manifest.json]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install Pillow
      - name: Import artwork and verify all original images and lesson content are preserved
        run: python tools/import-supplementary-artwork.py
      - name: Commit imported artwork and image connections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/supplementary/ worksheet.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Connect 17 fixed supplementary illustrations; preserve all 21 original worksheet images'
            git push
          fi
