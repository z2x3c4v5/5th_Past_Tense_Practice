<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하루 한 장 · 과거형 말하기</title>
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="leaf leaf1">🍁</div>
    <div class="leaf leaf2">🍂</div>
    <div class="leaf leaf3">🍁</div>
    <div class="leaf leaf4">🍂</div>
    <div class="leaf leaf5">🌰</div>
    <h1>🍂 하루 한 장 · 과거형 말하기</h1>
    <p class="subtitle">What did you do this summer? · 워크시트로 쓰고, 여기서 말해요!</p>
  </header>

  <!-- 📘 교과서 · Day 1 ~ 6 -->
  <nav id="day-strip" class="day-strip" aria-label="학습지 고르기"></nav>

  <div class="toolbar">
    <a class="docx-link" href="worksheets/past_tense_worksheet.docx" download>📄 워드 학습지 내려받기</a>
    <label class="speed-control">말하기 속도
      <input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="0.85" />
    </label>
    <span id="voice-status" class="voice-status"></span>
  </div>

  <main>
    <div id="question-banner" class="question-banner"></div>
    <div id="sheet" class="sheet"></div>
  </main>

  <footer class="app-footer">
    <span class="voice-status">5학년 영어 · 7단원 과거형 · 워크시트 + 웹 앱 연계 🍁</span>
  </footer>

  <script src="worksheet.js"></script>
  <script src="illustrations.js"></script>
  <script src="app.js"></script>
</body>
</html>
